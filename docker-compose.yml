# Full version: the app and Ollama with the vision model (Docker Desktop needs 6-8 GB of memory):
#     docker compose --profile full up --build
# On a Mac, Docker has no access to the GPU, so Ollama in a container runs on the CPU (minutes
# per photo). Run Ollama natively instead (ollama serve; ollama pull qwen3.5:4b-q4_K_M) and:
#     docker compose --profile mac up --build
# Lite: rules + OCR only, no Ollama (about 3 GB):
#     docker compose --profile lite up --build
# Then open http://localhost:8000. The first start downloads the Commons car photos (set
# WIKIMEDIA_CONTACT), builds the scale demo and writes the photos of the cars on the lot to
# ./demo_photos. Later starts restore the demo in seconds.

x-app: &app
  build: .
  image: vehicle-matcher
  ports:
    - "127.0.0.1:8000:8000"  # this computer only
  environment: &app-env
    SCALE_COUNT: ${SCALE_COUNT:-200}
    WIKIMEDIA_CONTACT: ${WIKIMEDIA_CONTACT:-}
  volumes:
    - app-data:/app/data              # database, snapshot, uploads, engine caches
    - models:/home/app/.cache         # PaddleOCR and plate reader models, downloaded once
    - exteriors:/app/tests/fixtures/exteriors
    - ./demo_photos:/app/demo_photos  # photos of the cars on the lot, to try on the Find page
  restart: unless-stopped

services:
  app:
    <<: *app
    profiles: [full]
    environment:
      <<: *app-env
      OLLAMA_MODEL: qwen3.5:4b-q4_K_M
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  app-mac:
    <<: *app
    profiles: [mac]
    environment:
      <<: *app-env
      OLLAMA_MODEL: qwen3.5:4b-q4_K_M
      OLLAMA_HOST: http://host.docker.internal:11434  # Ollama running natively, with the GPU
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-lite:
    <<: *app
    profiles: [lite]

  ollama:
    image: ollama/ollama:0.40.3
    profiles: [full]
    # Serve, and pull the model on the first start (about 3.4 GB; kept in the ollama volume).
    entrypoint: ["/bin/sh", "-c", "ollama serve & pid=$$!; sleep 3; ollama pull qwen3.5:4b-q4_K_M && wait $$pid"]
    environment:
      OLLAMA_KEEP_ALIVE: "0"        # the app loads the model only while it reads a photo
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen3.5:4b-q4_K_M"]
      interval: 15s
      timeout: 10s
      start_period: 30m
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  models:
  exteriors:
  ollama:
