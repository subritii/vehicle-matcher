{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% block title %}Find invoice by photo{% endblock %}
{% block content %}
<div class="mx-auto max-w-4xl">
  <div class="mb-8 flex flex-wrap items-start justify-between gap-4 sm:mb-10">
    <div>
      <h1 class="text-3xl font-bold tracking-tight {{ ui.H }} sm:text-4xl">Find invoice by photo</h1>
      <p class="mt-3 text-lg {{ ui.MUTED }}">Your photos compared with every invoice. Nothing is saved unless you choose to.</p>
    </div>
    <a href="/find" class="{{ ui.BTN2 }} shrink-0 py-2.5">New search</a>
  </div>
  {% include "_find_status.html" %}
</div>
{% endblock %}
